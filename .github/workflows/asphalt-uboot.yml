name: Build Asphalt U-Boot

on:
  workflow_dispatch:
    inputs:
      reference_ref:
        description: "Branch, tag, or commit of dianqk/nixos-android-devices"
        required: true
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Asphalt U-Boot
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NIXOS_ANDROID_DEVICES: ${{ github.workspace }}/nixos-android-devices

    steps:
      - name: Checkout Debian Asphalt
        uses: actions/checkout@v4

      - name: Checkout U-Boot reference
        uses: actions/checkout@v4
        with:
          repository: dianqk/nixos-android-devices
          ref: ${{ inputs.reference_ref }}
          path: nixos-android-devices
          fetch-depth: 1

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and validate U-Boot image
        run: ./asphalt-uboot_build.sh

      - name: Upload U-Boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asphalt-uboot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/uboot/boot_asphalt_uboot.img
            build/uboot/asphalt-disabled-dtbo.img
            build/uboot/uboot-lenovo-asphalt_2026.10~rc5_arm64.deb
            build/uboot/SHA256SUMS
          if-no-files-found: error
          retention-days: 30